name: autofix.ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install tools
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: prek,typos-cli,taplo-cli

      - name: Run prek fixers
        run: prek run --all-files --color always || true

      - name: Cargo fmt
        run: cargo fmt --all

      - name: Cargo clippy --fix
        run: |
          cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings || true

      - name: Taplo format
        run: taplo fmt

      - name: Typos (auto-correct)
        run: typos --write-changes || true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
