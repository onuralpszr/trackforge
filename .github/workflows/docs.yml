name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.11"
          activate-environment: "true"

      - name: Install dependencies
        run: |
          uv pip install zensical "mkdocstrings[python]" maturin
          cargo install cargo-docs-md

      - name: Build Python package
        run: maturin develop

      - name: Generate Rustdoc JSON
        run: cargo +nightly doc --no-deps
        env:
          RUSTDOCFLAGS: "-Z unstable-options --output-format json"

      - name: Convert Rustdoc to Markdown
        run: |
          mkdir -p docs/api
          cargo docs-md -p target/doc/trackforge.json -o docs/api --full-method-docs
          python3 scripts/fix_docs.py

      - name: Build Zensical site
        run: zensical build --clean

      - name: Install mdbook
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: mdbook

      - name: Build the book under /book
        run: |
          mdbook build book
          mkdir -p site/book
          cp -r book/book/. site/book/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
